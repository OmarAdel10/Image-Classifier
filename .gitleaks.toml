# gitleaks configuration for Flutter/Dart project
# Based on https://github.com/gitleaks/gitleaks

[allowlist]
description = "Allowlisted patterns and paths"
# Regex patterns for files/paths to ignore
regexes = [
  '''\.gitleaks\.toml$''',
  '''pubspec\.lock$''',
  '''CHANGELOG\.md$''',
  '''\.md$''',
  '''test/.*''',
  '''integration_test/.*''',
  '''android/.*/build/.*''',
  '''ios/.*/build/.*''',
  '''linux/.*/build/.*''',
  '''macos/.*/build/.*''',
  '''windows/.*/build/.*''',
  '''web/.*/build/.*''',
  '''build/.*''',
  '''\.dart_tool/.*''',
  '''\.iml$''',
  '''\.log$''',
  '''\.DS_Store$''',
]

# Custom rules for common secret patterns
[[rules]]
id = "generic-api-key"
description = "Generic API key pattern"
regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?token)['"\s]*[:=]['"\s]*[a-zA-Z0-9_\-]{20,}'''
tags = ["key", "api"]
message = "Potential API key detected"

[[rules]]
id = "generic-password"
description = "Generic password in config"
regex = '''(?i)(password|passwd|pwd)['"\s]*[:=]['"\s]*[^\s'"]{8,}'''
tags = ["password"]
message = "Potential password detected"

# Standard gitleaks rules (built-in) will also run
# See https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml