name: image_classifier
description: "Image Classifier — Flutter Linux desktop app for real-time image classification using a PyTorch CNN backend via FastAPI. Drag-and-drop images, view top-5 predictions with confidence bars, and model metadata."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: 1.2.2
  provider: ^6.1.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  fl_chart: ^0.66.2
  path: ^1.9.0
  mime: ^1.0.4
  cross_file: ^0.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true