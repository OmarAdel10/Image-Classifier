[project]
name = "cnn-classifier"
version = "0.1.0"
description = "CIFAR-10 CNN Classifier Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    # torch>=2.6.0: first CVE-2025-32434-patched release
    # (weights_only=True RCE, GHSA-53q9-r3pm-6pq6)
    "torch>=2.6.0,<3.0.0",
    "torchvision>=0.21.0,<1.0.0",
    "pillow>=10.4.0,<13.0.0",
    # Required by FastAPI for multipart/form-data uploads (/predict).
    "python-multipart>=0.0.7,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "ruff>=0.1.0,<1.0.0",
    "black>=23.0.0,<25.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cnn_classifier*"]
