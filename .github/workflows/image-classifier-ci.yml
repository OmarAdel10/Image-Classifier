name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-3.47.6-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.6-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  python-backend:
    name: Python Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # first run downloads CIFAR-10 (~170MB); cached runs ~5 min
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install '.[dev]'

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src/ tests/

      - name: Format check (black)
        working-directory: backend
        run: black --check src/ tests/

      - name: Cache CIFAR-10 dataset
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /home/runner/.cache/cnn-cifar10
          key: cifar10-python-md5-c58f3010
          restore-keys: cifar10-python-

      - name: Download CIFAR-10 (if not cached)
        run: |
          mkdir -p /home/runner/.cache/cnn-cifar10
          if [ ! -f /home/runner/.cache/cnn-cifar10/cifar-10-python.tar.gz ]; then
            wget -c --tries=3 --timeout=60 -P /home/runner/.cache/cnn-cifar10 https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
          fi
          echo 'c58f30108f718f92721af3b95e74349a  /home/runner/.cache/cnn-cifar10/cifar-10-python.tar.gz' | md5sum -c -

      - name: Run tests (pytest)
        working-directory: backend
        env:
          CNN_TEST_DATA_DIR: /home/runner/.cache/cnn-cifar10
        run: python -m pytest tests/ -v
