name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag-on-master:
    name: Verify tag is on master
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag ancestry against origin/master
        id: check
        run: |
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")" || {
            echo "::error::cannot resolve ${GITHUB_SHA} to a commit"
            exit 1
          }
          if git merge-base --is-ancestor "$commit" origin/master; then
            echo "is_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_master=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and release
    needs: tag-on-master
    if: needs.tag-on-master.outputs.is_master == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag unchanged (TOCTOU guard)
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          test "$(git rev-parse "refs/tags/${tag_name}^{commit}")" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Linux desktop release
        run: flutter build linux

      - name: Package release bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/image-classifier-linux.zip" .

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Automated release from tag ${{ steps.tag.outputs.tag }}.
            Built with Flutter 3.47.6 (stable).
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            image-classifier-linux.zip
