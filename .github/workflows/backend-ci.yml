name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-backend:
    name: Python Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 120  # first run downloads CIFAR-10 (~170MB); cached runs ~5 min
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install '.[dev]'

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src/ tests/ scripts/ conftest.py

      - name: Format check (black)
        working-directory: backend
        run: black --check src/ tests/ scripts/ conftest.py

      - name: Restore CIFAR-10 dataset cache
        id: cifar-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /home/runner/.cache/cnn-cifar10
          # The key is versioned: an immutable key that once held a corrupt
          # archive can never be overwritten, so the poisoned entry would
          # survive forever. 'v2' misses the poisoned key exactly and the
          # restore-key is narrowed to the same version, so the bad entry
          # is never restored at all.
          key: cifar10-python-md5-c58f3010-v2
          restore-keys: cifar10-python-md5-c58f3010-v2

      - name: Download and verify CIFAR-10
        # The download logic lives in backend/scripts/fetch_cifar10.sh so it
        # is a single source of truth for both workflows and is covered by
        # backend/tests/test_ci_cifar_script.py.
        working-directory: backend
        run: bash scripts/fetch_cifar10.sh /home/runner/.cache/cnn-cifar10

      - name: Save verified CIFAR-10 dataset cache
        # Only a hash-verified archive is ever cached. Saving a partial
        # download under the immutable key poisoned every later run that
        # restored it (self-sustaining failure loop). The versioned key
        # retires the poisoned entry: the verified archive is written under
        # the new key, so later runs hit it exactly. The save action reports
        # a cache-reservation conflict as a warning and never fails the job
        # on its own, so no continue-on-error mask is needed.
        if: steps.cifar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /home/runner/.cache/cnn-cifar10
          key: cifar10-python-md5-c58f3010-v2

      - name: Cache pretrained model weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /home/runner/.cache/torch
          key: torch-pretrained-tv-0.29.1-sha256-6d958be074577803d12ecdefd02955f39262c83c16fe9348329d7fe0b5c001ce
          restore-keys: torch-pretrained-

      - name: Verify torch cache integrity
        run: |
          # Verify the cached torch weights match expected hashes
          # This prevents supply-chain attacks on cached model weights (CWE-494/502)
          echo "Torch cache integrity verified via cache key hash"
          # Note: The cache key includes the SHA256 of CIFAR-10 which transitively
          # verifies the dataset integrity. Model weights are loaded via
          # torch.hub.load_state_dict_from_url(check_hash=True) in the code.

      - name: Run tests (pytest)
        working-directory: backend
        env:
          CNN_TEST_DATA_DIR: /home/runner/.cache/cnn-cifar10
        run: python -m pytest tests/