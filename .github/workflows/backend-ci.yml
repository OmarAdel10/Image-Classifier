name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-backend:
    name: Python Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # first run downloads CIFAR-10 (~170MB); cached runs ~5 min
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install '.[dev]'

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src/ tests/ scripts/ conftest.py

      - name: Format check (black)
        working-directory: backend
        run: black --check src/ tests/ scripts/ conftest.py

      - name: Cache CIFAR-10 dataset
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /home/runner/.cache/cnn-cifar10
          key: cifar10-python-md5-c58f3010
          restore-keys: cifar10-python-

      - name: Download and verify CIFAR-10 (self-healing cache)
        run: |
          mkdir -p /home/runner/.cache/cnn-cifar10
          cd /home/runner/.cache/cnn-cifar10
          # Self-heal: purge a corrupt or partial archive instead of
          # failing forever on an immutable cache key. Purge on EITHER
          # hash mismatch (md5 or sha256).
          if [ ! -f cifar-10-python.tar.gz ] \
             || ! md5sum -c <<< 'c58f30108f718f92721af3b95e74349a  cifar-10-python.tar.gz' \
             || ! sha256sum -c <<< '6d958be074577803d12ecdefd02955f39262c83c16fe9348329d7fe0b5c001ce  cifar-10-python.tar.gz'; then
            rm -f cifar-10-python.tar.gz
            # Each attempt is capped at 10 min of wall clock: wget --timeout
            # only bounds per-read stalls, so a throttled transfer can
            # otherwise hang for the whole job (observed 37m+). -c resumes
            # the partial archive across attempts instead of restarting from
            # byte 0; the md5/sha256 checks below fail the step if the
            # archive is still incomplete after 3 attempts.
            for attempt in 1 2 3; do
              timeout 600 wget -c -q --timeout=60 https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz && break
            done
          fi
          echo 'c58f30108f718f92721af3b95e74349a  cifar-10-python.tar.gz' | md5sum -c -
          echo '6d958be074577803d12ecdefd02955f39262c83c16fe9348329d7fe0b5c001ce  cifar-10-python.tar.gz' | sha256sum -c -

      - name: Cache pretrained model weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /home/runner/.cache/torch
          key: torch-pretrained-tv-0.29.1
          restore-keys: torch-pretrained-

      - name: Run tests (pytest)
        working-directory: backend
        env:
          CNN_TEST_DATA_DIR: /home/runner/.cache/cnn-cifar10
        run: python -m pytest tests/ --cov=cnn_classifier --cov-branch --cov-fail-under=100 -v